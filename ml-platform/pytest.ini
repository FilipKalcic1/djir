[pytest]
testpaths = tests
# A pickle built by another scikit-learn version is an error, not a warning (R26).
# Starlette 1.x warns that its TestClient's httpx transport is deprecated (it
# suggests httpx2). The TestClient still works on httpx, and
# serving/requirements.txt caps starlette below 2, so the warning is known and
# silenced on purpose.
filterwarnings =
    error::sklearn.exceptions.InconsistentVersionWarning
    ignore:Using `httpx` with `starlette.testclient` is deprecated
